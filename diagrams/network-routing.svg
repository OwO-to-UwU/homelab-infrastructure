<path d="M1033 311 H1072" fill="none" stroke="#627890" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="793" y="371" width="364" height="31" rx="8" fill="#e1f3eb" stroke="#a5d4be" stroke-width="2"/>
